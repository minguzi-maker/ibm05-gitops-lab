apiVersion: v1
kind: Service
metadata:
  name: hello-app-svc
  namespace: hello-app
spec:
#pod와 클라이언트를 연결하기 위해 서비스가 nodeport를 이용해 외부와 연결

#ClusterIP --------------------------------------------------

#(기본값, 생략 시 자동 적용)	클러스터 내부에서만 접근 가능한 가상 IP를 부여.
 #앞서 bgd 서비스가 이 타입이었습니다 —그래서 외부 접속을 위해 port-forward가 필요했던 것

#LoadBalancer	--------------------------------------------------

#NodePort 기능을 포함하면서, 클라우드 제공자(AWS ELB, GCP LB 등)의 
#로드밸런서를 자동으로 프로비저닝해서 외부 트래픽을 분산 처리.
# 온프레미스/로컬 환경(지금처럼 Vagrant+kubeadm)에서는 별도 구현체(MetalLB 등) 없이는 
#EXTERNAL-IP가 계속 <pending>으로 남습니다  
  type: NodePort
  selector:
    app: hello-app    # ★ 이 라벨을 가진 파드를 찾아서 연결
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
